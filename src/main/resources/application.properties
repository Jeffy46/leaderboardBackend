spring.application.name=backend

server.port=${PORT:8080}

# Database credentials: reads Azure environment variables if present, 
# otherwise falls back to your local credentials
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#base endpoint that can access backend. Note must be base link so nothing after .com
allowedEndpoint=https://example.com


# # ==============================================================================
# # AZURE WEB APP BACKEND INITIALIZATION & DEPLOYMENT INSTRUCTIONS
# # ==============================================================================

# # STEP 1: LOGIN TO AZURE CLI
# # Authenticate your terminal with your Azure account.
# az login


# # STEP 2: CREATE THE WEB APP
# # Creates the managed runtime container where the application runs.
# # Note: App names are globally unique across all Azure users (*.azurewebsites.net).
# # Check available Java runtimes via: az webapp list-runtimes --linux
# az webapp create \
#   --name "app-mybackend-prod" \
#   --resource-group "rg-backend-prod" \
#   --plan "plan-backend-prod" \
#   --runtime "JAVA:17-java17"

# # Verification: Navigate to https://<APP_NAME>.azurewebsites.net in a browser
# # Expected: Default Azure App Service welcome splash screen


# # STEP 3: CONFIGURE ENVIRONMENT VARIABLES & APP SETTINGS
# # Map properties like 'allowedEndpoint' (as ALLOWED_ENDPOINT) into Azure App Settings.
# # Spring Boot automatically maps uppercase SNAKE_CASE env vars to kebab-case properties.
# az webapp config appsettings set \
#   --name "app-mybackend-prod" \
#   --resource-group "rg-backend-prod" \
#   --settings \
#     APP_ALLOWED_URL="https://yourfrontend.com" \
#     PORT="8080"

# # Verification: Inspect the active environment settings list
# az webapp config appsettings list --name "app-mybackend-prod" --resource-group "rg-backend-prod" -o table


